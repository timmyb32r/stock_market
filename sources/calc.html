// ============================================================
// UTILITIES
// ============================================================

function parseDate(s) {
  const p = s.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

function fmtDate(s) {
  const p = s.split('-');
  return `${p[2]}.${p[1]}.${p[0]}`;
}

function fmtRub(n) {
  if (n == null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + ' млн ₽';
  if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(0) + ' тыс ₽';
  return n.toFixed(2) + ' ₽';
}

function fmtPct(n) {
  if (n == null || isNaN(n)) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

// Get key rate for a given date string YYYY-MM-DD
function getKeyRate(dateStr) {
  // Binary search for latest rate <= dateStr
  let lo = 0, hi = KEY_RATES.length - 1;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (KEY_RATES[mid][0] <= dateStr) lo = mid;
    else hi = mid - 1;
  }
  return KEY_RATES[lo][1];
}

// Get IRUS close for a given date, or nearest earlier date
const _irusMap = new Map(IRUS_DATA);
function getIRUS(dateStr) {
  if (_irusMap.has(dateStr)) return _irusMap.get(dateStr);
  // Find nearest earlier
  for (let i = IRUS_DATA.length - 1; i >= 0; i--) {
    if (IRUS_DATA[i][0] <= dateStr) return IRUS_DATA[i][1];
  }
  return IRUS_DATA[0][1];
}

// Generate list of all dates in range
function* dateRange(start, end) {
  const d = parseDate(start);
  const e = parseDate(end);
  while (d <= e) {
    const iso = d.toISOString().slice(0, 10);
    yield iso;
    d.setDate(d.getDate() + 1);
  }
}

// ============================================================
// PORTFOLIO SIMULATION ENGINE
// ============================================================

function simulate(initialCapital, maxPositions) {
  // Sort trades by date_buy, then by ticker (for determinism on same day)
  const sorted = [...TRADES].sort((a, b) => {
    if (a.date_buy !== b.date_buy) return a.date_buy.localeCompare(b.date_buy);
    return a.ticker.localeCompare(b.ticker);
  });

  const FIRST_DATE = '2023-08-25';
  const today = new Date().toISOString().slice(0, 10);
  const LAST_DATE = today > '2026-07-24' ? '2026-07-24' : today;

  let cash = initialCapital;
  const positions = [];  // {ticker, entry_date, entry_price, shares}
  const navHistory = [];
  const tradeLog = [];
  let tradeIdx = 0;

  // Pre-build daily event map
  const sellsByDate = new Map();  // date -> [{ticker, entry_date, entry_price, shares, sell_price, sell_date}]
  for (const t of sorted) {
    if (!sellsByDate.has(t.date_sell)) sellsByDate.set(t.date_sell, []);
    sellsByDate.get(t.date_sell).push(t);
  }

  // Pre-sort buys by date
  const buysByDate = new Map();
  for (let i = 0; i < sorted.length; i++) {
    const t = sorted[i];
    if (!buysByDate.has(t.date_buy)) buysByDate.set(t.date_buy, []);
    buysByDate.get(t.date_buy).push({...t, idx: i});
  }

  for (const date of dateRange(FIRST_DATE, LAST_DATE)) {
    // 1. Process sells on this date
    const sells = sellsByDate.get(date) || [];
    for (const t of sells) {
      // Find the matching open position
      const posIdx = positions.findIndex(p => p.ticker === t.ticker && p.entry_date <= date && !p.closed);
      if (posIdx >= 0) {
        const pos = positions[posIdx];
        const proceeds = pos.shares * t.price_sell;
        cash += proceeds;
        pos.closed = true;
        pos.exit_date = t.date_sell;
        pos.exit_price = t.price_sell;
        pos.pnl = proceeds - pos.shares * pos.entry_price;
        // Log the trade
        tradeLog.push({
          ticker: t.ticker,
          entry_date: pos.entry_date,
          entry_price: pos.entry_price,
          exit_date: date,
          exit_price: t.price_sell,
          shares: pos.shares,
          cost: pos.shares * pos.entry_price,
          proceeds: proceeds,
          pnl: pos.pnl,
          skipped: false
        });
      }
    }

    // 2. Remove closed positions (free slots)
    for (let i = positions.length - 1; i >= 0; i--) {
      if (positions[i].closed) positions.splice(i, 1);
    }

    // 3. Process buys on this date
    const buys = buysByDate.get(date) || [];
    for (const t of buys) {
      if (positions.length >= maxPositions) {
        // Skip this signal
        tradeLog.push({
          ticker: t.ticker,
          entry_date: date,
          entry_price: t.price_buy,
          skipped: true
        });
        continue;
      }
      // Total NAV = cash + value of open positions (at entry price)
      const openValue = positions.reduce((sum, p) => sum + p.shares * p.entry_price, 0);
      const totalNAV = cash + openValue;
      const slotCapital = totalNAV / maxPositions;
      const shares = slotCapital / t.price_buy;
      cash -= slotCapital;
      positions.push({
        ticker: t.ticker,
        entry_date: date,
        entry_price: t.price_buy,
        shares: shares,
        closed: false
      });
    }

    // 4. Accrue cash at daily key rate
    const annualRate = getKeyRate(date) / 100;
    const dailyRate = Math.pow(1 + annualRate, 1 / 365) - 1;
    cash *= (1 + dailyRate);

    // 5. Compute NAV
    const openValue = positions.reduce((sum, p) => sum + p.shares * p.entry_price, 0);
    const nav = cash + openValue;

    navHistory.push({ date, nav, cash });
  }

  const finalNAV = navHistory[navHistory.length - 1].nav;
  const totalReturn = ((finalNAV - initialCapital) / initialCapital) * 100;

  return { navHistory, tradeLog, finalNAV, totalReturn };
}

// ============================================================
// BENCHMARK LINES (IRUS & LQDT)
// ============================================================

function irusBenchmark(initialCapital) {
  const FIRST_DATE = '2023-08-25';
  const today = new Date().toISOString().slice(0, 10);
  const LAST_DATE = today > '2026-07-24' ? '2026-07-24' : today;
  const baseClose = getIRUS(FIRST_DATE);

  // Build a map of known IRUS closes, then fill every date by linear interpolation
  const known = new Map(IRUS_DATA);
  const dates = [...dateRange(FIRST_DATE, LAST_DATE)];
  const points = [];

  // For each date, find bracketing known IRUS points and interpolate
  let prevDate = null, prevClose = null;
  let nextDate = null, nextClose = null;
  let irusIdx = 0;

  for (const date of dates) {
    // Advance irusIdx to bracket this date
    while (irusIdx < IRUS_DATA.length && IRUS_DATA[irusIdx][0] <= date) {
      prevDate = IRUS_DATA[irusIdx][0];
      prevClose = IRUS_DATA[irusIdx][1];
      irusIdx++;
    }
    nextDate = irusIdx < IRUS_DATA.length ? IRUS_DATA[irusIdx][0] : null;
    nextClose = irusIdx < IRUS_DATA.length ? IRUS_DATA[irusIdx][1] : null;

    let close;
    if (known.has(date)) {
      close = known.get(date);
    } else if (prevDate && nextDate) {
      // Linear interpolation
      const d0 = parseDate(prevDate).getTime();
      const d1 = parseDate(nextDate).getTime();
      const d = parseDate(date).getTime();
      const t = (d - d0) / (d1 - d0);
      close = prevClose + t * (nextClose - prevClose);
    } else if (prevDate) {
      close = prevClose;
    } else {
      close = nextClose;
    }

    points.push({ date, nav: initialCapital * (close / baseClose) });
  }

  return points;
}

function lqdtBenchmark(initialCapital) {
  const FIRST_DATE = '2023-08-25';
  const today = new Date().toISOString().slice(0, 10);
  const LAST_DATE = today > '2026-07-24' ? '2026-07-24' : today;
  const points = [];
  let cash = initialCapital;
  for (const date of dateRange(FIRST_DATE, LAST_DATE)) {
    const annualRate = getKeyRate(date) / 100;
    const dailyRate = Math.pow(1 + annualRate, 1 / 365) - 1;
    cash *= (1 + dailyRate);
    points.push({ date, nav: cash });
  }
  return points;
}

let mainChart = null;

const IRUS_COLOR = '#000000';
const LQDT_COLOR = '#ff0000';

function buildChart(initialCapital, currentN) {
  const canvas = document.getElementById('mainChart');
  const ctx = canvas.getContext('2d');
  // Destroy any existing chart on this canvas (including from failed previous attempt)
  const existing = Chart.getChart(canvas);
  if (existing) existing.destroy();
  if (mainChart) mainChart.destroy();
  mainChart = null;

  const datasets = [];

  // Current N portfolio line
  const sim = simulate(initialCapital, currentN);
  const portData = sim.navHistory.filter((_, i) => i % 7 === 0 || i === sim.navHistory.length - 1);
  datasets.push({
    label: `Портфель (N=${currentN})`,
    data: portData.map(p => ({ x: parseDate(p.date).getTime(), y: p.nav })),
    borderColor: '#4a90d9',
    backgroundColor: 'rgba(74,144,217,0.1)',
    borderWidth: 3,
    pointRadius: 0,
    tension: 0.1
  });

  // IRUS benchmark
  const irus = irusBenchmark(initialCapital);
  const irusSampled = irus.filter((_, i) => i % 7 === 0 || i === irus.length - 1);
  datasets.push({
    label: 'IRUS (MCFTR)',
    data: irusSampled.map(p => ({ x: parseDate(p.date).getTime(), y: p.nav })),
    borderColor: IRUS_COLOR,
    borderWidth: 2.5,
    borderDash: [8, 3],
    pointRadius: 0,
    tension: 0.1
  });

  // LQDT benchmark
  const lqdt = lqdtBenchmark(initialCapital);
  const lqdtSampled = lqdt.filter((_, i) => i % 7 === 0 || i === lqdt.length - 1);
  datasets.push({
    label: 'LQDT (ставка ЦБ)',
    data: lqdtSampled.map(p => ({ x: parseDate(p.date).getTime(), y: p.nav })),
    borderColor: LQDT_COLOR,
    borderWidth: 2.5,
    borderDash: [3, 3],
    pointRadius: 0,
    tension: 0.1
  });

  mainChart = new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${fmtRub(ctx.parsed.y)}`
          }
        },
        legend: {
          position: 'bottom',
          labels: {
            boxWidth: 20,
            font: { size: 11 },
            padding: 8
          }
        }
      },
      scales: {
        x: {
          type: 'time',
          time: { unit: 'month', displayFormats: { month: 'MMM yyyy' } },
          title: { display: false },
          min: parseDate('2023-08-25').getTime()
        },
        y: {
          title: { display: true, text: 'Капитал, ₽' },
          ticks: {
            callback: v => fmtRub(v)
          }
        }
      }
    }
  });
}

function showStats(sim, initialCapital) {
  const trades = sim.tradeLog.filter(t => !t.skipped);
  const skipped = sim.tradeLog.filter(t => t.skipped);
  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl <= 0);

  const totalPnL = trades.reduce((s, t) => s + t.pnl, 0);
  const avgReturn = trades.length > 0
    ? trades.reduce((s, t) => s + (t.pnl / t.cost * 100), 0) / trades.length
    : 0;

  // Annualized return (CAGR)
  const firstDate = parseDate(sim.navHistory[0].date);
  const lastDate = parseDate(sim.navHistory[sim.navHistory.length - 1].date);
  const years = (lastDate - firstDate) / (365.25 * 24 * 60 * 60 * 1000);
  const cagr = years > 0 ? (Math.pow(sim.finalNAV / initialCapital, 1 / years) - 1) * 100 : 0;

  const dateFrom = sim.navHistory[0].date;
  const dateTo = sim.navHistory[sim.navHistory.length - 1].date;

  document.getElementById('stats').innerHTML = `
    <div class="date-range-bar">
      📅 Дата начала: <span>${fmtDate(dateFrom)}</span>
      &nbsp;→&nbsp; Дата завершения: <span>${fmtDate(dateTo)}</span>
    </div>
    <div class="stat-card">
      <div class="label">Финальный капитал</div>
      <div class="value ${sim.finalNAV >= initialCapital ? 'positive' : 'negative'}">${fmtRub(sim.finalNAV)}</div>
    </div>
    <div class="stat-card">
      <div class="label">Общая доходность</div>
      <div class="value ${sim.totalReturn >= 0 ? 'positive' : 'negative'}">${fmtPct(sim.totalReturn)}</div>
    </div>
    <div class="stat-card">
      <div class="label">Годовая доходность (CAGR)</div>
      <div class="value ${cagr >= 0 ? 'positive' : 'negative'}">${fmtPct(cagr)}</div>
    </div>
    <div class="stat-card">
      <div class="label">Совершено сделок</div>
      <div class="value">${trades.length} / ${sim.tradeLog.length}</div>
      <div class="trade-pnl">пропущено: ${skipped.length}</div>
    </div>
    <div class="stat-card">
      <div class="label">Прибыльных / убыточных</div>
      <div class="value">${wins.length} / ${losses.length}</div>
      <div class="trade-pnl">win rate: ${trades.length > 0 ? (wins.length/trades.length*100).toFixed(0) : 0}%</div>
    </div>
    <div class="stat-card">
      <div class="label">Средняя доходность на сделку</div>
      <div class="value ${avgReturn >= 0 ? 'positive' : 'negative'}">${fmtPct(avgReturn)}</div>
    </div>
    <div class="stat-card">
      <div class="label">Суммарный P&L</div>
      <div class="value ${totalPnL >= 0 ? 'positive' : 'negative'}">${fmtRub(totalPnL)}</div>
    </div>
  `;
}

function showTradeTable(sim) {
  const allTrades = sim.tradeLog;
  let html = `<table>
    <thead><tr>
      <th>#</th><th>Ticker</th><th class="sep-left-header">Дата входа</th><th>Цена входа</th>
      <th class="sep-left-header">Дата выхода</th><th>Цена выхода</th><th class="sep-left-header">Кол-во</th>
      <th>Затраты</th><th>Выручка</th><th>P&L</th><th>Доходность</th>
    </tr></thead><tbody>`;

  for (let i = 0; i < allTrades.length; i++) {
    const t = allTrades[i];
    if (t.skipped) {
      html += `<tr class="skipped">
        <td>${i + 1}</td><td>${t.ticker}</td><td>${fmtDate(t.entry_date)}</td>
        <td>${t.entry_price.toFixed(2)}</td>
        <td colspan="7" style="color:#c00">⏭ Пропущен (все ${document.getElementById('maxPositions').value} слотов заняты)</td>
      </tr>`;
    } else {
      const ret = (t.pnl / t.cost * 100);
      html += `<tr>
        <td>${i + 1}</td><td><b>${t.ticker}</b></td>
        <td class="sep-left">${fmtDate(t.entry_date)}</td><td>${t.entry_price.toFixed(2)}</td>
        <td class="sep-left">${fmtDate(t.exit_date)}</td><td>${t.exit_price.toFixed(2)}</td>
        <td class="sep-left">${t.shares.toFixed(0)}</td>
        <td>${fmtRub(t.cost)}</td><td>${fmtRub(t.proceeds)}</td>
        <td class="${t.pnl >= 0 ? 'return-positive' : 'return-negative'}">${fmtRub(t.pnl)}</td>
        <td class="${ret >= 0 ? 'return-positive' : 'return-negative'}">${fmtPct(ret)}</td>
      </tr>`;
    }
  }
  html += '</tbody></table>';
  document.getElementById('tradeTable').innerHTML = html;
}

// ============================================================
// MAIN RECALC
// ============================================================

let sweepResults = null;

function recalc() {
  const initialCapital = parseFloat(document.getElementById('initialCapital').value) || 1000000;
  const maxPositions = parseInt(document.getElementById('maxPositions').value) || 5;
  const sim = simulate(initialCapital, maxPositions);

  showStats(sim, initialCapital);
  showTradeTable(sim);
  buildChart(initialCapital, maxPositions);

  // Store for sweep summary
  window._lastSim = sim;
  window._lastCapital = initialCapital;
  window._lastN = maxPositions;
}

// ============================================================
// SWEEP: N=1..14
// ============================================================

async function runSweep() {
  const btn = document.getElementById('btnSweep');
  const clearBtn = document.getElementById('btnClear');
  const loading = document.getElementById('loading');
  const initialCapital = parseFloat(document.getElementById('initialCapital').value) || 1000000;

  btn.disabled = true;
  loading.classList.add('visible');

  // Run in chunks to keep UI responsive
  sweepResults = [];
  for (let n = 1; n <= 14; n++) {
    await new Promise(resolve => {
      setTimeout(() => {
        const sim = simulate(initialCapital, n);
        sweepResults.push({
          n,
          navHistory: sim.navHistory,
          finalNAV: sim.finalNAV,
          totalReturn: sim.totalReturn,
          tradesMade: sim.tradeLog.filter(t => !t.skipped).length,
          tradesSkipped: sim.tradeLog.filter(t => t.skipped).length
        });
        resolve();
      }, 0);
    });
  }

  loading.classList.remove('visible');
  btn.disabled = false;
  clearBtn.style.display = 'inline-block';

  showSweepSummary(sweepResults, initialCapital, parseInt(document.getElementById('maxPositions').value) || 5);
  recalc(); // will rebuild chart with sweep lines
}

let sweepChart = null;

function buildSweepChart(results, currentN) {
  const container = document.getElementById('sweepChartContainer');
  const canvas = document.getElementById('sweepChart');
  container.style.display = 'block';

  const existing = Chart.getChart(canvas);
  if (existing) existing.destroy();
  if (sweepChart) sweepChart.destroy();
  sweepChart = null;

  const labels = results.map(r => r.n);
  const data = results.map(r => r.totalReturn);
  const bgColors = results.map(r => r.n === currentN ? '#4a90d9' : (r.totalReturn >= 0 ? '#2ca02c' : '#d62728'));

  sweepChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Доходность, %',
        data,
        backgroundColor: bgColors,
        borderColor: bgColors.map(c => c === '#4a90d9' ? '#3a7bc8' : c),
        borderWidth: 1,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        tooltip: {
          callbacks: {
            label: ctx => `Доходность: ${fmtPct(ctx.parsed.y)}`
          }
        },
        legend: { display: false }
      },
      scales: {
        x: {
          title: { display: true, text: 'N (макс. позиций)' },
          ticks: { stepSize: 1 }
        },
        y: {
          title: { display: true, text: 'Доходность, %' },
          ticks: {
            callback: v => fmtPct(v)
          }
        }
      }
    }
  });
}

function clearSweep() {
  sweepResults = null;
  _sweepData = null;
  _sweepSort = {col: null, asc: true};
  document.getElementById('btnClear').style.display = 'none';
  document.getElementById('sweepSummary').innerHTML = '';
  document.getElementById('sweepChartContainer').style.display = 'none';
  if (sweepChart) { sweepChart.destroy(); sweepChart = null; }
  recalc();
}

let _sweepData = null;
let _sweepSort = {col: null, asc: true};

function sortSweepTable(col) {
  if (_sweepSort.col === col) {
    _sweepSort.asc = !_sweepSort.asc;
  } else {
    _sweepSort.col = col;
    _sweepSort.asc = true;
  }
  renderSweepSummary();
}

function renderSweepSummary() {
  if (!_sweepData) return;
  const {results, initialCapital, currentN} = _sweepData;
  const best = results.reduce((a, b) => a.totalReturn > b.totalReturn ? a : b);
  const worst = results.reduce((a, b) => a.totalReturn < b.totalReturn ? a : b);

  buildSweepChart(results, currentN);

  // Sort
  const sorted = [...results];
  const {col, asc} = _sweepSort;
  if (col) {
    const keyMap = {n: 'n', capital: 'finalNAV', return: 'totalReturn', trades: 'tradesMade', skipped: 'tradesSkipped'};
    const key = keyMap[col];
    sorted.sort((a, b) => {
      const va = a[key], vb = b[key];
      return asc ? va - vb : vb - va;
    });
  }

  const arrow = (c) => {
    if (_sweepSort.col !== c) return '<span class="sort-arrow">▾</span>';
    return `<span class="sort-arrow active">${_sweepSort.asc ? '▴' : '▾'}</span>`;
  };

  let html = `<div class="section-title">📊 Сводка по всем N (1..14)</div>
    <table>
    <thead><tr>
      <th class="sort-header${_sweepSort.col==='n'?' '+(asc?'asc':'desc'):''}" onclick="sortSweepTable('n')">N ${arrow('n')}</th>
      <th class="sort-header${_sweepSort.col==='capital'?' '+(asc?'asc':'desc'):''}" onclick="sortSweepTable('capital')">Финальный капитал ${arrow('capital')}</th>
      <th class="sort-header${_sweepSort.col==='return'?' '+(asc?'asc':'desc'):''}" onclick="sortSweepTable('return')">Доходность ${arrow('return')}</th>
      <th class="sort-header${_sweepSort.col==='trades'?' '+(asc?'asc':'desc'):''}" onclick="sortSweepTable('trades')">Сделок ${arrow('trades')}</th>
      <th class="sort-header${_sweepSort.col==='skipped'?' '+(asc?'asc':'desc'):''}" onclick="sortSweepTable('skipped')">Пропущено ${arrow('skipped')}</th>
    </tr></thead><tbody>`;

  for (const r of sorted) {
    const cls = r.n === best.n ? 'best-row' : '';
    html += `<tr class="${cls}">
      <td><b>${r.n}</b></td>
      <td class="${r.totalReturn >= 0 ? 'return-positive' : 'return-negative'}">${fmtRub(r.finalNAV)}</td>
      <td class="${r.totalReturn >= 0 ? 'return-positive' : 'return-negative'}">${fmtPct(r.totalReturn)}</td>
      <td>${r.tradesMade}</td>
      <td>${r.tradesSkipped}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  html += `<p style="margin-top:8px;font-size:13px">
    🏆 Лучший результат: <b>N=${best.n}</b> — ${fmtRub(best.finalNAV)} (${fmtPct(best.totalReturn)})<br>
    📉 Худший результат: <b>N=${worst.n}</b> — ${fmtRub(worst.finalNAV)} (${fmtPct(worst.totalReturn)})<br>
    💰 IRUS (MCFTR): ${fmtRub(initialCapital * getIRUS('2026-07-24') / getIRUS('2023-08-25'))}<br>
    💵 LQDT (ставка ЦБ): ${fmtRub(lqdtBenchmark(initialCapital).pop().nav)}
  </p>`;
  document.getElementById('sweepSummary').innerHTML = html;
}

function showSweepSummary(results, initialCapital, currentN) {
  _sweepData = {results, initialCapital, currentN};
  _sweepSort = {col: null, asc: true};
  renderSweepSummary();
}

// ============================================================
// INIT
// ============================================================

recalc();
</script>
</body>
</html>
